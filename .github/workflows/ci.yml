name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request supersedes a run still waiting or
# running (Sagar, 2026-10-10).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The developer-experience review pull requests (doc/phase3/dx_protocol.md)
    # are never merged; their checks would only tell the reviewer the answer.
    if: ${{ !startsWith(github.head_ref, 'dx-review/') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Phase 0 harness
        working-directory: corpus/fixture_app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-${{ matrix.os }}
          path: corpus/fixture_app/build/phase0/
      - name: Catalogue (snapshots, A13, generated mutations)
        if: always()
        working-directory: corpus/catalogue_app
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze
          # Baselines are valid on macOS only (spec, A3); other hosts run
          # everything except the baseline comparisons.
          flutter test ${{ runner.os != 'macOS' && '--exclude-tags baseline' || '' }} \
            --file-reporter json:build/test_results.json
      - name: Annotate catalogue failures
        if: failure()
        run: |
          cp corpus/catalogue_app/tool/annotate_failures.dart "$RUNNER_TEMP/annotate_failures.dart"
          dart "$RUNNER_TEMP/annotate_failures.dart" corpus/catalogue_app/build/test_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalogue-${{ matrix.os }}
          path: corpus/catalogue_app/build/
