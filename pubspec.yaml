name: touchstone
description: >-
  Structured UI snapshots for Flutter widget tests. Reports which component
  and which kind of change differs, instead of only "image differs".
  Experimental: see the assumption register before relying on it.
version: 0.0.1-dev.0
publish_to: none
repository: https://github.com/SAGARSURI/touchstone

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
